<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إملاء النجوم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="game-screen">
            <h1>إملاء النجوم</h1>
            <div id="inputs-container"></div>
            <button onclick="playDictation()">ابدأ اللعب</button>
        </div>
        <button id="admin-login-btn" onclick="showLogin()">دخول المعلم</button>
        <div id="login-modal" class="hidden">
            <input type="password" id="password-input" placeholder="كلمة السر">
            <button onclick="checkPassword()">دخول</button>
        </div>
        <div id="admin-screen" class="hidden">
            <h2>لوحة تحكم المعلم</h2>
            <div id="admin-words-container"></div>
            <button onclick="addWordInput('')">إضافة كلمة</button>
            <br><br>
            <input type="email" id="email-input">
            <button onclick="saveAdminSettings()">حفظ الإعدادات</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
