<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة الإملاء</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <!-- الشريط العلوي -->
        <header class="app-header">
            <div class="progress-badge" id="word-counter">الكلمة 1 من 5</div>
            <div class="attempt-badge" id="attempt-badge">المحاولة 1 من 2</div>
            <div class="stars-badge">النجوم: <span id="star-count">0</span> ⭐</div>
        </header>

        <h1 class="game-title">🚀 مغامرة الإملاء الذكي</h1>

        <!-- شاشة اللعب الرئيسية -->
        <div id="game-area">
            <div class="audio-card">
                <button onclick="playCurrentWord()" class="btn-listen" id="listen-btn" title="اضغط لسماع الكلمة">
                    🔊
                </button>
                <p class="listen-hint">اضغط على السماعة لتسمع الكلمة بوضوح</p>
            </div>

            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="اكتب الكلمة هنا..." autocomplete="off" spellcheck="false">
            </div>

            <div class="controls-row">
                <button onclick="checkAnswer()" class="btn btn-check" id="check-btn">تحقق من إجابتي ✅</button>
                <button onclick="nextWord()" class="btn btn-next" id="next-btn">الكلمة التالية ⬅️</button>
            </div>

            <div id="feedback-box" class="feedback-box"></div>
        </div>

        <!-- شاشة النهاية -->
        <div id="end-screen" class="end-screen hidden">
            <div class="trophy-icon">🏆</div>
            <h2>أحسنت يا بطل! أنهيت التحدي</h2>
            <p class="final-score">مجموع نجومك: <span id="final-stars">0</span> ⭐</p>
            <button onclick="restartGame()" class="btn btn-restart">إعادة التحدي من البداية 🔄</button>
        </div>

        <!-- قسم دخول المعلم -->
        <footer class="app-footer">
            <button onclick="toggleLoginBox()" class="btn-teacher-link">🔒 دخول المعلم</button>
            
            <div id="login-box" class="login-box hidden">
                <input type="password" id="admin-password" placeholder="أدخل رمز المعلم">
                <button onclick="loginAdmin()" class="btn-login-submit">دخول</button>
            </div>
        </footer>
    </div>

    <!-- نافذة لوحة تحكم المعلم (مخفية تماماً ولا تظهر إلا بعد إدخال الرمز الصحيح) -->
    <div id="teacher-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>⚙️ إعدادات المعلم</h2>
                <button onclick="closeTeacherPanel()" class="btn-close">✖</button>
            </div>

            <div class="modal-body">
                <label class="section-label">قائمة كلمات الإملاء (يُفضل كتابتها بالتشكيل):</label>
                <div id="words-container" class="words-list"></div>
                <button onclick="addWordField('')" class="btn-add-word">+ إضافة كلمة جديدة</button>

                <hr class="divider">

                <label class="section-label">بريد المتابعة الإلكتروني:</label>
                <input type="email" id="teacher-email" class="modal-input" placeholder="teacher@school.com">
            </div>

            <div class="modal-footer">
                <button onclick="saveSettings()" class="btn btn-save">حفظ التغييرات وبدء اللعب 💾</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
